<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dompetku - Login</title>
    <meta name="description" content="Aplikasi pengelolaan keuangan pribadi premium dengan fitur lengkap: pencatatan pemasukan/pengeluaran, database lokal IndexedDB aman, batas anggaran dinamis, dan visualisasi grafik interaktif." />

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Style Sheet -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Background Blobs for Visual Aesthetics -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- 1. AUTH CONTAINER (LOGIN / REGISTER) -->
    <div id="auth-container" class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="logo">
            <i class="fa-solid fa-wallet-gradient fa-wallet"></i>
            <span>DompetKu</span>
          </div>
          <p id="auth-subtitle">Kelola keuangan harian secara cerdas, aman, dan mudah</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active">
          <h2>Selamat Datang Kembali</h2>
          <p class="form-desc">Silakan masuk ke akun keuangan Anda</p>

          <div class="input-group">
            <label for="login-username"><i class="fa-solid fa-user"></i> Username</label>
            <input type="text" id="login-username" required placeholder="Masukkan username Anda" />
          </div>

          <div class="input-group">
            <label for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="login-password" required placeholder="Masukkan password Anda" />
              <i class="fa-solid fa-eye toggle-password" id="toggle-login-password"></i>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Masuk <i class="fa-solid fa-right-to-bracket"></i></button>

          <div class="auth-divider"><span>atau</span></div>

          <button type="button" id="google-login-btn" class="btn btn-google btn-block">
            <svg width="18" height="18" viewBox="0 0 48 48" style="margin-right: 10px; flex-shrink: 0">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.29-8.16 2.29-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            Masuk dengan Google
          </button>

          <p class="auth-toggle-text">Belum punya akun? <a href="#" id="go-to-register">Daftar sekarang</a></p>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form">
          <h2>Buat Akun Baru</h2>
          <p class="form-desc">Mulai kelola keuangan Anda dengan lebih baik</p>

          <div class="input-group">
            <label for="register-username"><i class="fa-solid fa-user"></i> Username</label>
            <input type="text" id="register-username" required placeholder="Pilih username baru" />
          </div>

          <div class="input-group">
            <label for="register-password"><i class="fa-solid fa-lock"></i> Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="register-password" required placeholder="Pilih password minimal 6 karakter" />
              <i class="fa-solid fa-eye toggle-password" id="toggle-register-password"></i>
            </div>
          </div>

          <div class="input-group">
            <label for="register-confirm-password"><i class="fa-solid fa-lock"></i> Konfirmasi Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="register-confirm-password" required placeholder="Konfirmasi password Anda" />
              <i class="fa-solid fa-eye toggle-password" id="toggle-register-confirm-password"></i>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Daftar <i class="fa-solid fa-user-plus"></i></button>

          <div class="auth-divider"><span>atau</span></div>

          <button type="button" id="google-register-btn" class="btn btn-google btn-block">
            <svg width="18" height="18" viewBox="0 0 48 48" style="margin-right: 10px; flex-shrink: 0">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.29-8.16 2.29-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            Daftar dengan Google
          </button>

          <p class="auth-toggle-text">Sudah punya akun? <a href="#" id="go-to-login">Masuk sekarang</a></p>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <!-- Firebase SDK (compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  </body>
</html>
